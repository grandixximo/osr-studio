# Dual Release Workflow
# Builds both OSR Studio (modern UI) and OSR Studio (classic UI)
# Creates 4 packages: 2 installers + 2 portable versions

name: Dual Release - Modern & Classic UI

# Only runs when a version tag is pushed (e.g., v10.3.0)
# Creates production release with both UI versions
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-modern-ui:
    name: Build OSR Studio (Modern UI)
    runs-on: windows-2022
    
    env:
      Solution_Name: src/OsrStudio.sln

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -verbosity:minimal -property:Configuration=Release

    - name: Prepare distribution folder
      run: |
        New-Item -ItemType Directory -Force -Path dist
        New-Item -ItemType Directory -Force -Path temp
        
        $consoleBinFolder = "src/OsrStudio.Console/bin/Release"
        $uiBinFolder = "src/OsrStudio/bin/Release"
        
        # Copy License files
        Copy-Item -Path "licenses" -Destination "dist/licenses" -Recurse -Force
        
        # Copy Languages
        Copy-Item -Path "$uiBinFolder/Languages" -Destination "dist/languages" -Recurse -Force
        
        # Copy executables
        Copy-Item -Path "$consoleBinFolder/*.exe" -Destination "dist/" -Force
        Copy-Item -Path "$uiBinFolder/*.exe" -Destination "dist/" -Force
        
        # Copy config files
        if (Test-Path "$consoleBinFolder/osr-cli.exe.config") {
          Copy-Item -Path "$consoleBinFolder/osr-cli.exe.config" -Destination "dist/" -Force
        }
        if (Test-Path "$uiBinFolder/OsrStudio.exe.config") {
          Copy-Item -Path "$uiBinFolder/OsrStudio.exe.config" -Destination "dist/" -Force
        }
        
        # Copy Keymap files
        Copy-Item -Path "$uiBinFolder/keymaps" -Destination "dist/keymaps" -Recurse -Force
        
        # Create lib directory and copy DLL contents
        New-Item -ItemType Directory -Force -Path "dist/lib" | Out-Null
        
        if (Test-Path "$consoleBinFolder/lib") {
          Copy-Item -Path "$consoleBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
        if (Test-Path "$uiBinFolder/lib") {
          Copy-Item -Path "$uiBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
      shell: pwsh

    - name: Package portable version
      run: |
        # Create portable directories
        New-Item -ItemType Directory -Force -Path "dist/Settings"
        New-Item -ItemType Directory -Force -Path "dist/Codecs"
        
        $version = "${{ github.ref_name }}"
        $portableZip = "OSR-Studio-Modern-${version}-Portable.zip"
        Compress-Archive -Path "dist/*" -DestinationPath $portableZip
        echo "MODERN_PORTABLE=$portableZip" >> $env:GITHUB_OUTPUT
        
        # Remove portable-specific directories for installer
        Remove-Item -Path "dist/Settings" -Recurse -Force
        Remove-Item -Path "dist/Codecs" -Recurse -Force
      shell: pwsh
      id: package_modern

    - name: Install Inno Setup
      run: choco install innosetup -y
      shell: pwsh

    - name: Build installer with Inno Setup
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $versionTag = "${{ github.ref_name }}"
        $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        
        # Create custom Inno script for OSR Studio Modern UI
        $innoContent = Get-Content "Inno.iss" -Raw
        $innoContent = $innoContent -replace 'OutputBaseFilename=OSR-Studio-Setup', "OutputBaseFilename=OSR-Studio-Modern-${versionTag}-Setup"
        $innoContent | Set-Content "Inno-modern.iss"
        
        & $innoPath "/DMyAppVersion=$version" "/DVariant=Modern" "Inno-modern.iss"
        
        # Rename output file
        $installerName = "OSR-Studio-Modern-${versionTag}-Setup.exe"
        Move-Item -Path "temp/OSR-Studio-Modern-${versionTag}-Setup.exe" -Destination $installerName -Force
        echo "MODERN_INSTALLER=$installerName" >> $env:GITHUB_OUTPUT
      shell: pwsh
      id: installer_modern

    - name: Upload modern UI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OSR-Studio-Modern-UI
        path: |
          ${{ steps.package_modern.outputs.MODERN_PORTABLE }}
          ${{ steps.installer_modern.outputs.MODERN_INSTALLER }}

  build-classic-ui:
    name: Build OSR Studio (Classic UI)
    runs-on: windows-2022
    
    env:
      Solution_Name: src/OsrStudio.sln

    steps:
    - name: Checkout classic-ui branch
      uses: actions/checkout@v4
      with:
        ref: classic-ui
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -verbosity:minimal -property:Configuration=Release

    - name: Prepare distribution folder
      run: |
        New-Item -ItemType Directory -Force -Path dist
        New-Item -ItemType Directory -Force -Path temp
        
        $consoleBinFolder = "src/OsrStudio.Console/bin/Release"
        $uiBinFolder = "src/OsrStudio/bin/Release"
        
        # Copy License files
        Copy-Item -Path "licenses" -Destination "dist/licenses" -Recurse -Force
        
        # Copy Languages
        Copy-Item -Path "$uiBinFolder/Languages" -Destination "dist/languages" -Recurse -Force
        
        # Copy executables
        Copy-Item -Path "$consoleBinFolder/*.exe" -Destination "dist/" -Force
        Copy-Item -Path "$uiBinFolder/*.exe" -Destination "dist/" -Force
        
        # Copy config files
        if (Test-Path "$consoleBinFolder/osr-cli.exe.config") {
          Copy-Item -Path "$consoleBinFolder/osr-cli.exe.config" -Destination "dist/" -Force
        }
        if (Test-Path "$uiBinFolder/OsrStudio.exe.config") {
          Copy-Item -Path "$uiBinFolder/OsrStudio.exe.config" -Destination "dist/" -Force
        }
        
        # Copy Keymap files
        Copy-Item -Path "$uiBinFolder/keymaps" -Destination "dist/keymaps" -Recurse -Force
        
        # Create lib directory and copy DLL contents
        New-Item -ItemType Directory -Force -Path "dist/lib" | Out-Null
        
        if (Test-Path "$consoleBinFolder/lib") {
          Copy-Item -Path "$consoleBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
        if (Test-Path "$uiBinFolder/lib") {
          Copy-Item -Path "$uiBinFolder/lib/*" -Destination "dist/lib" -Recurse -Force
        }
      shell: pwsh

    - name: Package portable version
      run: |
        # Create portable directories
        New-Item -ItemType Directory -Force -Path "dist/Settings"
        New-Item -ItemType Directory -Force -Path "dist/Codecs"
        
        $version = "${{ github.ref_name }}"
        $portableZip = "OSR-Studio-Classic-${version}-Portable.zip"
        Compress-Archive -Path "dist/*" -DestinationPath $portableZip
        echo "CLASSIC_PORTABLE=$portableZip" >> $env:GITHUB_OUTPUT
        
        # Remove portable-specific directories for installer
        Remove-Item -Path "dist/Settings" -Recurse -Force
        Remove-Item -Path "dist/Codecs" -Recurse -Force
      shell: pwsh
      id: package_classic

    - name: Install Inno Setup
      run: choco install innosetup -y
      shell: pwsh

    - name: Build installer with Inno Setup
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $versionTag = "${{ github.ref_name }}"
        $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        
        # Create custom Inno script for OSR Studio Classic UI
        $innoContent = Get-Content "Inno.iss" -Raw
        $innoContent = $innoContent -replace 'OutputBaseFilename=OSR-Studio-Setup', "OutputBaseFilename=OSR-Studio-Classic-${versionTag}-Setup"
        $innoContent | Set-Content "Inno-classic.iss"
        
        & $innoPath "/DMyAppVersion=$version" "/DVariant=Classic" "Inno-classic.iss"
        
        # Rename output file
        $installerName = "OSR-Studio-Classic-${versionTag}-Setup.exe"
        Move-Item -Path "temp/OSR-Studio-Classic-${versionTag}-Setup.exe" -Destination $installerName -Force
        echo "CLASSIC_INSTALLER=$installerName" >> $env:GITHUB_OUTPUT
      shell: pwsh
      id: installer_classic

    - name: Upload classic UI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OSR-Studio-Classic-UI
        path: |
          ${{ steps.package_classic.outputs.CLASSIC_PORTABLE }}
          ${{ steps.installer_classic.outputs.CLASSIC_INSTALLER }}

  create-release:
    name: Create Dual Release
    needs: [build-modern-ui, build-classic-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download modern UI artifacts
      uses: actions/download-artifact@v4
      with:
        name: OSR-Studio-Modern-UI
        path: ./artifacts/modern

    - name: Download classic UI artifacts
      uses: actions/download-artifact@v4
      with:
        name: OSR-Studio-Classic-UI
        path: ./artifacts/classic

    - name: Delete existing release (if exists)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete ${{ github.ref_name }} --yes --repo ${{ github.repository }} || true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/modern/*
          ./artifacts/classic/*
        draft: false
        prerelease: false
        name: "Release ${{ github.ref_name }}"
        body: |
          ## 🎉 Dual Release: Choose Your UI! 
          
          This release includes **both UI versions** with all the latest fixes and improvements!
          
          ---
          
          ### 🆕 OSR Studio (Modern UI)
          
          The updated interface with modern design improvements.
          
          **Download:**
          - 💾 **Installer**: `OSR-Studio-Modern-${{ github.ref_name }}-Setup.exe` *(Recommended)*
          - 📦 **Portable**: `OSR-Studio-Modern-${{ github.ref_name }}-Portable.zip` *(No installation required)*
          
          ---
          
          ### 🎨 OSR Studio Classic (8.0.0 UI)
          
          Original interface design with all modern fixes - best of both worlds!
          
          **Download:**
          - 💾 **Installer**: `OSR-Studio-Classic-${{ github.ref_name }}-Setup.exe` *(Recommended)*
          - 📦 **Portable**: `OSR-Studio-Classic-${{ github.ref_name }}-Portable.zip` *(No installation required)*
          
          ---
          
          ### ✅ What's Included in Both Versions
          
          - ✅ **Fixed FFmpeg Downloader** - Reliable mirrors with automatic fallback
          - ✅ **Windows 11 Compatible** - Tested on latest Windows versions
          - ✅ **.NET Framework Fixes** - Better compatibility with older systems
          - ✅ **All Bug Fixes** - Latest stability improvements
          
          ### 🤔 Which Should I Choose?
          
          Both versions have **identical functionality** - the only difference is the UI design:
          
          - **OSR Studio (Modern UI)** - Modern interface with updated layout
          - **OSR Studio Classic** - Original 8.0.0 UI design with vertical button layout
          
          **💡 Recommendation:** Choose based on your UI preference - both have all the same features and bug fixes!
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
